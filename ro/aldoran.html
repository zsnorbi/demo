// ══════════════════════════════════════════════
//  EROU PIXELAT
// ══════════════════════════════════════════════
function shade(h,p){let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);r=Math.max(0,Math.min(255,r+p));g=Math.max(0,Math.min(255,g+p));b=Math.max(0,Math.min(255,b+p));return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}

function drawHero(canvas,hero){
  const ctx=canvas.getContext('2d'),S=5,W=20,H=24;
  canvas.width=W*S;canvas.height=H*S;
  const{skin:sc,hair,ap,as2,wc,belt,eye}=hero;
  const dk=shade(sc,-30);
  function px(x,y,c){ctx.fillStyle=c;ctx.fillRect(x*S,y*S,S,S);}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let x=7;x<=12;x++)px(x,0,hair);
  for(let x=6;x<=13;x++)px(x,1,hair);
  [2,3,4].forEach(y=>{px(6,y,hair);px(13,y,hair);});
  for(let y=1;y<=5;y++)for(let x=7;x<=12;x++)px(x,y,sc);
  px(8,3,eye);px(11,3,eye);px(9,4,dk);px(10,4,dk);px(8,5,dk);px(11,5,dk);
  px(6,3,sc);px(13,3,sc);
  for(let x=8;x<=11;x++)px(x,6,sc);
  for(let y=7;y<=12;y++)for(let x=6;x<=13;x++)px(x,y,ap);
  for(let x=7;x<=12;x++)px(x,7,as2);
  for(let y=8;y<=11;y++){px(7,y,as2);px(12,y,as2);}
  px(9,9,as2);px(10,9,as2);px(9,10,as2);px(10,10,as2);
  for(let x=6;x<=13;x++)px(x,13,belt);
  px(9,13,'#c0a030');px(10,13,'#c0a030');
  for(let y=14;y<=18;y++){for(let x=7;x<=9;x++)px(x,y,ap);for(let x=10;x<=12;x++)px(x,y,ap);}
  px(7,14,as2);px(12,14,as2);
  for(let x=7;x<=9;x++)px(x,19,'#2a1800');for(let x=10;x<=12;x++)px(x,19,'#2a1800');
  for(let y=7;y<=13;y++){px(5,y,ap);px(6,y,ap);px(13,y,ap);px(14,y,ap);}
  for(let y=14;y<=15;y++){px(5,y,sc);px(14,y,sc);}
  if(hero.weapon==='sword'){for(let y=5;y<=16;y++)px(16,y,wc);px(15,10,'#8a6020');px(17,10,'#8a6020');px(16,17,'#8a6020');for(let y=5;y<=9;y++)px(15,y,'#e8e8e8');}
  else if(hero.weapon==='bow'){for(let y=3;y<=17;y++)px(16,y,wc);for(let y=3;y<=17;y++)px(17,y,'#e8d090');for(let y=8;y<=14;y++)px(15,y,'#c0a050');px(14,8,'#cc4400');}
  else if(hero.weapon==='axe'){for(let y=5;y<=18;y++)px(16,y,'#8a5a20');[5,6].forEach(y=>{px(15,y,wc);px(17,y,wc);});[7,8].forEach(y=>{px(14,y,wc);px(18,y,wc);});px(15,9,wc);px(17,9,wc);}
  else if(hero.weapon==='staff'){for(let y=0;y<=18;y++)px(16,y,wc);px(16,0,'#d090ff');px(15,0,'#9050ff');px(17,0,'#9050ff');px(15,1,'#b070ff');px(17,1,'#b070ff');}
  px(7,5,hair);px(12,5,hair);
}

// ══════════════════════════════════════════════
//  DESENAREA HĂRȚII — hartă overworld pe 16 biți compusă manual
// ══════════════════════════════════════════════
let MW=0,MH=0;
const COLS=64, ROWS=38, TS=12;
const VW=COLS*TS, VH=ROWS*TS;
const chestOpen=[false,false,false,false];
let chestRects=[];

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function hash(c,r){let n=(c*374761393+r*668265263)>>>0;n=(n^(n>>13))*1274126177;return ((n^(n>>16))>>>0)/4294967296;}
function tileType(c,r){
  // regiuni ajustate manual, mai naturale, fără forme pătrate
  const riverX = 31 + Math.sin(r*.42)*2.3 + Math.sin(r*.13)*1.2;
  const river = Math.abs(c-riverX)<1.15;
  const lake = ((c-20)/8.7)**2 + ((r-25)/4.7)**2 < 1 || ((c-14)/4.8)**2 + ((r-27)/3.4)**2 < 1;
  if(river || lake) return 'water';

  const mountainEdge = 17 + Math.sin(c*.45)*2.1 + Math.sin(c*.18)*1.4;
  if(c<25 && r<mountainEdge) return 'mountain';

  const forestEdge = 20 + Math.sin(c*.33)*2.4 - Math.cos(r*.41)*1.2;
  if(c>36 && r<forestEdge) return 'forest';
  if(c>27 && c<41 && r<11 && hash(c,r)>.35) return 'forest';

  const desertEdge = 17 + Math.sin(r*.38)*2.4 + Math.cos(c*.21)*1.3;
  if(c>39 && r>desertEdge) return 'desert';
  if(c>33 && r>27 + Math.sin(c*.3)*1.4) return 'desert';

  if(c<30 && r>19 && r<33 && hash(c,r)>.82) return 'marsh';
  return 'grass';
}
function px(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function drawTerrainTile(ctx,c,r,type){
  const x=c*TS,y=r*TS,n=hash(c,r);
  const pal={
    grass:['#31572c','#3f6f33','#26461f'],
    mountain:['#5e554d','#746a60','#38332f'],
    forest:['#173b15','#24591f','#0d240c'],
    water:['#155b7a','#237fa5','#0b3448'],
    desert:['#b98739','#d0a557','#8d6429'],
    marsh:['#294c38','#3e7050','#1a3023']
  }[type];
  px(ctx,x,y,TS,TS,pal[0]);
  if(n>.74)px(ctx,x+1,y+1,TS-2,2,pal[1]);
  if(n<.18)px(ctx,x+TS-3,y+TS-3,2,2,pal[2]);
  if(type==='water'){
    if((c+r)%4===0)px(ctx,x+2,y+5,7,1,'rgba(190,230,245,.55)');
  }
  if(type==='desert'){
    if((c+r)%5===0)px(ctx,x+2,y+7,8,1,'rgba(255,226,142,.45)');
  }
}
function drawMountainIcon(ctx,c,r){
  const x=c*TS,y=r*TS;
  px(ctx,x+1,y+8,10,3,'#2f2b28');
  ctx.fillStyle='#8a8178';ctx.beginPath();ctx.moveTo(x+1,y+10);ctx.lineTo(x+6,y+1);ctx.lineTo(x+11,y+10);ctx.fill();
  ctx.fillStyle='#514a45';ctx.beginPath();ctx.moveTo(x+6,y+1);ctx.lineTo(x+11,y+10);ctx.lineTo(x+6,y+10);ctx.fill();
  ctx.fillStyle='#e5e6da';ctx.beginPath();ctx.moveTo(x+6,y+1);ctx.lineTo(x+4,y+5);ctx.lineTo(x+8,y+5);ctx.fill();
}
function drawTreeIcon(ctx,c,r,dark=false){
  const x=c*TS,y=r*TS;
  px(ctx,x+5,y+8,2,4,'#63401f');
  ctx.fillStyle=dark?'#0e2f0d':'#236d22';ctx.beginPath();ctx.moveTo(x+6,y+1);ctx.lineTo(x+1,y+8);ctx.lineTo(x+11,y+8);ctx.fill();
  ctx.fillStyle=dark?'#154915':'#2f7f29';ctx.beginPath();ctx.moveTo(x+6,y+4);ctx.lineTo(x+2,y+10);ctx.lineTo(x+10,y+10);ctx.fill();
}
function drawCactusIcon(ctx,c,r){
  const x=c*TS,y=r*TS;ctx.strokeStyle='#2f6b2d';ctx.lineWidth=2;ctx.lineCap='square';
  ctx.beginPath();ctx.moveTo(x+6,y+10);ctx.lineTo(x+6,y+2);ctx.moveTo(x+6,y+6);ctx.lineTo(x+3,y+6);ctx.lineTo(x+3,y+4);ctx.moveTo(x+6,y+7);ctx.lineTo(x+9,y+7);ctx.lineTo(x+9,y+5);ctx.stroke();
}

function drawCastle(ctx,c,r){
  const x=c*TS,y=r*TS,s=TS;
  px(ctx,x-23,y+5,58,28,'#68636d');px(ctx,x-30,y-7,14,42,'#827b86');px(ctx,x+28,y-7,14,42,'#827b86');px(ctx,x-8,y-15,26,50,'#918995');
  for(let i=0;i<6;i++)px(ctx,x-28+i*12,y-15,7,7,'#918995');
  px(ctx,x-2,y+18,12,17,'#2a180d');px(ctx,x+7,y-30,2,18,'#201610');px(ctx,x+9,y-30,18,9,'#b52327');
  px(ctx,x-17,y+8,6,8,'#1c2530');px(ctx,x+23,y+8,6,8,'#1c2530');px(ctx,x+2,y-2,7,9,'#1c2530');
  ctx.strokeStyle='#2b2425';ctx.lineWidth=2;ctx.strokeRect(x-23,y+5,58,28);
}
function drawChest(ctx,c,r,open,idx){
  const x=c*TS,y=r*TS,s=14,acc=['#b83210','#246f33','#25779b','#c8953b'][idx];
  px(ctx,x-2,y+s+6,34,5,'rgba(0,0,0,.35)');
  if(open){
    px(ctx,x-4,y-8,36,8,'rgba(255,218,74,.38)');px(ctx,x,y+2,28,18,'#7b4112');px(ctx,x,y-7,28,8,'#5d2b0d');
    px(ctx,x+5,y+5,5,4,'#ffd84a');px(ctx,x+13,y+6,5,4,'#fff0a5');px(ctx,x+20,y+5,5,4,'#ffd84a');
  }else{px(ctx,x,y,28,19,'#7b4112');px(ctx,x,y-7,28,9,'#9b5a20');}
  px(ctx,x,y+3,28,4,acc);px(ctx,x+10,y+7,8,8,'#efc33c');
  ctx.strokeStyle='#2d1606';ctx.lineWidth=2;ctx.strokeRect(x,y,28,19);
}
function drawMapLabel(ctx,text,c,r,w=118){

  const x = Math.round(c * TS);
  const y = Math.round(r * TS);

  const lines = text.split('\n');

  const fs = 14;
  const lh = 17;
  const bh = lines.length * lh + 10;

  ctx.font = `bold ${fs}px Cinzel`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const bx = Math.round(x - w/2);
  const by = Math.round(y - bh/2);

  px(ctx,bx,by,w,bh,'rgba(14,6,0,.78)');

  ctx.strokeStyle='#d5aa35';
  ctx.lineWidth=1;

  ctx.strokeRect(
    bx + 2,
    by + 2,
    w - 4,
    bh - 4
  );

  lines.forEach((l,i)=>{

    const ty = Math.round(
      y - (lines.length - 1) * lh / 2 + i * lh
    );

    ctx.fillStyle='#2b1200';
    ctx.fillText(l, x + 1, ty + 1);

    ctx.fillStyle='#f2dfaa';
    ctx.fillText(l, x, ty);
  });
}
function drawCompass(ctx){
  const x=59*TS,y=33*TS,r=22;px(ctx,x-r,y-r,r*2,r*2,'#e9d49b');ctx.strokeStyle='#5b3109';ctx.lineWidth=2;ctx.strokeRect(x-r,y-r,r*2,r*2);
  ctx.fillStyle='#a51e22';ctx.beginPath();ctx.moveTo(x,y-r+5);ctx.lineTo(x-6,y);ctx.lineTo(x+6,y);ctx.fill();
  ctx.fillStyle='#52504c';ctx.beginPath();ctx.moveTo(x,y+r-5);ctx.lineTo(x-6,y);ctx.lineTo(x+6,y);ctx.fill();
  ctx.fillStyle='#2a1200';ctx.font='bold 12px Cinzel,serif';ctx.textAlign='center';ctx.fillText('N',x,y-r-5);
}
function drawMiniMap(ctx){
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,VW,VH);
  // terrain base
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)drawTerrainTile(ctx,c,r,tileType(c,r));


  // elemente de teren — rărite, ca să nu devină încărcat
  for(let r=1;r<16;r+=2)for(let c=2;c<25;c+=3){if(tileType(c,r)==='mountain'&&hash(c,r)>.22)drawMountainIcon(ctx,c,r);}
  for(let r=1;r<20;r+=2)for(let c=35;c<62;c+=3){if(tileType(c,r)==='forest'&&hash(c,r)>.20)drawTreeIcon(ctx,c,r,true);}
  for(let r=19;r<34;r+=2)for(let c=4;c<24;c+=4){if((tileType(c,r)==='grass'||tileType(c,r)==='marsh')&&hash(c,r)>.62)drawTreeIcon(ctx,c,r,false);}
  for(let r=19;r<36;r+=3)for(let c=42;c<62;c+=5){if(tileType(c,r)==='desert'&&hash(c,r)>.35)drawCactusIcon(ctx,c,r);}

  drawCastle(ctx,31,18);

  const chests=[[13,9],[50,9],[15,29],[50,27]];
  chestRects=[];const sx=MW/VW,sy=MH/VH;
  chests.forEach(([c,r],i)=>{
    drawChest(ctx,c,r,chestOpen[i],i);
    chestRects.push({x:c*TS*sx,y:(r*TS-8)*sy,w:32*sx,h:34*sy,idx:i});
    if(!chestOpen[i]){ctx.font='bold 13px Cinzel,serif';ctx.textAlign='center';ctx.fillStyle='#211000';ctx.fillText('APASĂ',c*TS+15,r*TS+34);ctx.fillStyle='#f4d46b';ctx.fillText('APASĂ',c*TS+14,r*TS+33);}
  });

  // etichete mari și clare
  drawMapLabel(ctx,'CREASTA\nMINEREULUI',12,3,118);
  drawMapLabel(ctx,'PĂDUREA\nȘOPTITOARE',49,3,112);
  drawMapLabel(ctx,'LACUL\nSTELAR',15,21,120);
  drawMapLabel(ctx,'NISIPUL\nDE AUR',49,22,132);
  drawMapLabel(ctx,'CETATEA\nALDORAN',31,14,96);

  drawCompass(ctx);
  ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=5;ctx.strokeRect(2,2,VW-4,VH-4);
  ctx.strokeStyle='rgba(244,196,48,.6)';ctx.lineWidth=2;ctx.strokeRect(12,12,VW-24,VH-24);
}
function drawMap(){
  const mc=document.getElementById('mapCanvas');
  mc.setAttribute('aria-label','Harta Aldoranului: apasă pe cuferele mari pentru a vedea cantitatea de aur.');
  mc.setAttribute('role','img');
  MW=mc.parentElement.offsetWidth||1000;MH=Math.round(MW*(VH/VW));mc.width=MW;mc.height=MH;
  const ctx=mc.getContext('2d');ctx.imageSmoothingEnabled=false;
  const off=document.createElement('canvas');off.width=VW;off.height=VH;
  const octx=off.getContext('2d');drawMiniMap(octx);
  ctx.clearRect(0,0,MW,MH);ctx.imageSmoothingEnabled=false;ctx.drawImage(off,0,0,MW,MH);
}

document.getElementById('mapCanvas').addEventListener('click',function(e){
  const rect=this.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(MW/rect.width), my=(e.clientY-rect.top)*(MH/rect.height);
  chestRects.forEach(cr=>{
    if(mx>=cr.x&&mx<=cr.x+cr.w&&my>=cr.y&&my<=cr.y+cr.h){
      if(!chestOpen[cr.idx]){chestOpen[cr.idx]=true;drawMap();}
      openTreasure(cr.idx);
    }
  });
});

const heroColors=['#cc2200','#4a6aaa','#6a6a6a','#e8a820'];
document.getElementById('heroesGrid') && HEROES.forEach((hero,i)=>{
  const card=document.createElement('div');card.className='hero-card';

  const lbl=document.createElement('div');lbl.className='env-label';lbl.textContent='DESCHIDE SCRISOAREA';

  const stats=document.createElement('div');stats.className='hero-stats';

    <div class="stat-line"><span class="stat-key">ARMĂ</span><span class="stat-value">${hero.weaponName}</span></div>
    <div class="stat-line"><span class="stat-key">PUTERE</span><span class="stat-value">${hero.strength}</span></div>
    <div class="hero-health">
      <div class="hero-health-label"><span>VIAȚĂ</span><span>${hero.health}/100</span></div>
      <div class="hero-health-bar"><div class="hero-health-fill" style="width:${hero.health}%"></div></div>
    </div>
  `;

  card.appendChild(nm);card.appendChild(cv);card.appendChild(stats);card.appendChild(btn);
  document.getElementById('heroesGrid').appendChild(card);
});

function openLetter(idx){
  closeTreasure();
  document.getElementById('letterTitle').textContent=HEROES[idx].letter.title;
  document.getElementById('letterBody').innerHTML=HEROES[idx].letter.body;
  document.getElementById('letterSig').textContent=HEROES[idx].letter.sig;
  document.getElementById('letterModal').classList.add('open');
  document.body.classList.add('modal-open');
}
function anyModalOpen(){return ['letterModal','treasureModal','codeModal'].some(id=>document.getElementById(id).classList.contains('open'));}
function closeLetter(){document.getElementById('letterModal').classList.remove('open');if(!anyModalOpen())document.body.classList.remove('modal-open');}
document.getElementById('letterModal').addEventListener('click',function(e){if(e.target===this)closeLetter();});

function openCodeModal(){
  closeLetter();
  closeTreasure();
  document.getElementById('cppCode').textContent=CPP_CODE;
  document.getElementById('codeModal').classList.add('open');
  document.body.classList.add('modal-open');
}
function closeCodeModal(){document.getElementById('codeModal').classList.remove('open');if(!anyModalOpen())document.body.classList.remove('modal-open');}
document.getElementById('codeModal').addEventListener('click',function(e){if(e.target===this)closeCodeModal();});

function openTreasure(idx){
  closeLetter();
  closeCodeModal();
  const t=ZONES[idx].chest;
  document.getElementById('treasureTitle').textContent='🪙 '+t.title+' 🪙';
  document.getElementById('treasureIcon').textContent=t.icon;
  document.getElementById('treasureName').textContent=t.region;
  document.getElementById('treasureStats').innerHTML=`
    <div class="stat-row"><span class="stat-label">AUR:</span> ${t.gold} buc.</div>
  `;
  document.getElementById('treasureDesc').textContent=t.desc;
  document.getElementById('treasureModal').classList.add('open');
  document.body.classList.add('modal-open');
}
function closeTreasure(){document.getElementById('treasureModal').classList.remove('open');if(!anyModalOpen())document.body.classList.remove('modal-open');}
document.getElementById('treasureModal').addEventListener('click',function(e){if(e.target===this)closeTreasure();});

document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeLetter();closeTreasure();closeCodeModal();}});
window.addEventListener('load',()=>drawMap());
window.addEventListener('resize',()=>drawMap());
</script>
