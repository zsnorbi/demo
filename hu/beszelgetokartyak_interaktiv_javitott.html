<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interaktív beszélgetőkártyák – 10. osztály</title>
  <style>
    :root {
      --bg: #f4efe7;
      --paper: #fffaf2;
      --ink: #26221d;
      --muted: #6d6256;
      --border: #d7c5ad;
      --accent: #7a4e2d;
      --accent2: #efe1cf;
      --shadow: 0 12px 30px rgba(72, 47, 26, .18);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 35rem),
        linear-gradient(135deg, #f8f0e6, var(--bg));
    }

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 14px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 4vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 auto;
      max-width: 760px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 18px 20px;
    }

    .toolbtn {
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: var(--paper);
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(72, 47, 26, .08);
    }

    .toolbtn:hover,
    .toolbtn:focus {
      background: var(--accent);
      color: white;
      outline: none;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 18px 36px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .card {
      position: relative;
      display: block;
      width: 100%;
      height: 220px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      perspective: 1000px;
      -webkit-tap-highlight-color: transparent;
    }

    .cardInner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .55s ease;
    }

    .card.flipped .cardInner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      overflow: hidden;
      padding: 18px;
      text-align: center;
    }

    .front::before,
    .back::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px dashed rgba(122, 78, 45, .35);
      border-radius: 16px;
      pointer-events: none;
    }

    .front {
      background:
        linear-gradient(145deg, rgba(255,255,255,.95), rgba(239,225,207,.9)),
        var(--paper);
    }

    .back {
      transform: rotateY(180deg);
      background:
        linear-gradient(145deg, rgba(255,250,242,.98), rgba(255,255,255,.9)),
        var(--paper);
    }

    .small {
      z-index: 1;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .86rem;
    }

    .num {
      z-index: 1;
      display: block;
      color: var(--accent);
      font-size: clamp(4.6rem, 10vw, 6.6rem);
      font-weight: 900;
      line-height: .95;
      margin: 10px 0 12px;
    }

    .hint {
      z-index: 1;
      color: var(--muted);
      font-size: .92rem;
    }

    .qnum {
      z-index: 1;
      align-self: flex-start;
      color: var(--accent);
      font-weight: 900;
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .question {
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      font-weight: 800;
      font-size: clamp(1.05rem, 2.2vw, 1.32rem);
      line-height: 1.22;
    }

    .card:focus-visible .face {
      outline: 4px solid rgba(122, 78, 45, .35);
      outline-offset: 4px;
    }

    footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 18px 28px;
      color: var(--muted);
      text-align: center;
      font-size: .95rem;
    }

    @media (max-width: 460px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .card {
        height: 185px;
      }
      .face {
        padding: 12px;
        border-radius: 18px;
      }
      .front::before,
      .back::before {
        inset: 8px;
      }
      .question {
        font-size: .96rem;
        line-height: 1.18;
      }
      .hint {
        font-size: .78rem;
      }
    }

    @media print {
      .toolbar, footer {
        display: none;
      }
      body {
        background: white;
      }
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .card {
        height: 190px;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .face {
        box-shadow: none;
      }
    }
  </style>
</head>

      var grid = document.getElementById('cardGrid');
      var shuffleBtn = document.getElementById('shuffleBtn');
      var resetBtn = document.getElementById('resetBtn');

      function getCards() {
        return Array.prototype.slice.call(grid.querySelectorAll('.card'));
      }

      function toggleCard(card) {
        card.classList.toggle('flipped');
        var number = card.getAttribute('data-number');
        var isFlipped = card.classList.contains('flipped');
        card.setAttribute('aria-label', isFlipped
          ? number + '. kártya kérdése megnyitva'
          : number + '. beszélgetőkártya');
      }

      grid.addEventListener('click', function (event) {
        var card = event.target.closest('.card');
        if (!card || !grid.contains(card)) return;
        toggleCard(card);
      });

      grid.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        var card = event.target.closest('.card');
        if (!card || !grid.contains(card)) return;
        event.preventDefault();
        toggleCard(card);
      });

      resetBtn.addEventListener('click', function () {
        getCards().forEach(function (card) {
          card.classList.remove('flipped');
          card.setAttribute('aria-label', card.getAttribute('data-number') + '. beszélgetőkártya');
        });
      });

      shuffleBtn.addEventListener('click', function () {
        var cards = getCards();
        for (var i = cards.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = cards[i];
          cards[i] = cards[j];
          cards[j] = temp;
        }
        cards.forEach(function (card) {
          card.classList.remove('flipped');
          grid.appendChild(card);
        });
      });
    })();
  </script>
</body>
</html>
